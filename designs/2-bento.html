<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Özkaya — Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one dense bento board; each tile answers one recruiter question at a glance, details open in a sheet. */
:root {
  --bg: #e9ebef;
  --tile: #ffffff;
  --tile-2: #f4f5f8;
  --ink: #111318;
  --soft: #646a7a;
  --line: rgba(17, 19, 24, .08);
  --accent: #512bd4;
  --accent-ink: #ffffff;
  --ok: #12a150;
  --glow: rgba(81, 43, 212, .35);
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07080a; --tile: #121317; --tile-2: #191a20; --ink: #f1f2f4; --soft: #8f94a3; --line: rgba(255,255,255,.08); --accent: #8d6bff; --accent-ink: #0b0614; --ok: #3ddc84; --glow: rgba(141,107,255,.45); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #07080a; --tile: #121317; --tile-2: #191a20; --ink: #f1f2f4; --soft: #8f94a3; --line: rgba(255,255,255,.08); --accent: #8d6bff; --accent-ink: #0b0614; --ok: #3ddc84; --glow: rgba(141,107,255,.45); color-scheme: dark; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 1240px; margin: 0 auto; padding-block: clamp(16px, 3vw, 36px) 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
.bar .mark { font: 700 18px/1 var(--display); letter-spacing: -.02em; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--tile); border: 1px solid var(--line); font: 500 12px/1 var(--mono); }
.pill:hover { border-color: var(--accent); }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(150px, auto); gap: 12px; }
.tile { position: relative; background: var(--tile); border: 1px solid var(--line); border-radius: 22px; padding: 20px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; isolation: isolate; }
.tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: radial-gradient(260px circle at var(--mx, -999px) var(--my, -999px), var(--glow), transparent 70%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.tile::after { content: ""; position: absolute; inset: 0; background: radial-gradient(420px circle at var(--mx, -999px) var(--my, -999px), color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%); pointer-events: none; z-index: -1; }
.k { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
.big { font: 800 clamp(40px, 4.6vw, 64px)/.95 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.grow { flex: 1; }

/* spans */
.s-intro { grid-column: span 2; grid-row: span 2; justify-content: space-between; gap: 24px; }
.s-2 { grid-column: span 2; }
.s-r2 { grid-row: span 2; }

/* intro */
.mono-av { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 800 24px/1 var(--display); letter-spacing: -.03em; }
.intro h1 { font: 800 clamp(36px, 4.4vw, 60px)/.95 var(--display); letter-spacing: -.045em; margin-top: 18px; }
.intro .hl { font: 500 clamp(17px, 1.5vw, 20px)/1.4 var(--body); color: var(--soft); margin-top: 12px; max-width: 30ch; text-wrap: balance; }
.status { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/1 var(--body); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
.cta { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 12px; font-weight: 600; background: var(--tile-2); border: 1px solid var(--line); transition: transform .15s; }
.btn.primary { background: var(--ink); color: var(--tile); border-color: var(--ink); }
.btn:hover { transform: translateY(-1px); }

/* clock */
.clock .t { font: 700 clamp(34px, 3.4vw, 46px)/1 var(--mono); letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: auto; }
.clock .d { color: var(--soft); font-size: 13px; margin-top: 6px; }

/* stat */
.stat .big { margin-top: auto; }
.stat p { color: var(--soft); margin-top: 6px; font-size: 14px; }
.team { display: grid; grid-template-columns: repeat(5, 14px); gap: 6px; margin-top: 14px; }
.team i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); opacity: .9; }
.team i:first-child { background: var(--ink); }

/* now */
.now h3 { font: 700 26px/1.05 var(--display); letter-spacing: -.03em; margin-top: 10px; }
.now p { color: var(--soft); }
.now .since { margin-top: auto; display: flex; justify-content: space-between; align-items: end; gap: 8px; }
.now .since b { font: 800 28px/1 var(--display); letter-spacing: -.03em; white-space: nowrap; }

/* career bar to scale */
.career .track { display: flex; height: 44px; border-radius: 12px; overflow: hidden; margin-top: 18px; gap: 3px; }
.career .seg { display: flex; align-items: center; padding: 0 10px; font: 600 12px/1 var(--body); white-space: nowrap; overflow: hidden; color: var(--accent-ink); }
.career .seg:nth-child(1) { background: color-mix(in srgb, var(--accent) 45%, var(--tile-2)); color: var(--ink); }
.career .seg:nth-child(2) { background: color-mix(in srgb, var(--accent) 70%, var(--tile-2)); }
.career .seg:nth-child(3) { background: var(--accent); }
.career .axis { display: flex; justify-content: space-between; font: 500 11px/1 var(--mono); color: var(--soft); margin-top: 8px; }
.career ul { list-style: none; display: grid; gap: 10px; margin-top: 16px; }
.career li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.career li i { width: 10px; height: 10px; border-radius: 3px; }
.career li span { color: var(--soft); font: 500 12px/1.3 var(--mono); }
.career li em { font-style: normal; color: var(--soft); display: block; font-size: 13px; }

/* arch */
.arch svg { width: 100%; height: auto; margin-top: auto; max-width: 100%; }
.arch text { font: 500 10px var(--mono); fill: var(--soft); }
.arch .box { fill: var(--tile-2); stroke: var(--line); }
.arch .acc { fill: var(--accent); }
.arch .acc-t { fill: var(--accent-ink); font-weight: 600; }
.arch .ln { stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 3; fill: none; opacity: .6; }
.arch p { color: var(--soft); font-size: 14px; margin-top: 6px; }
.arch h3 { font: 700 22px/1.1 var(--display); letter-spacing: -.02em; margin-top: 8px; }

/* marquee */
.stack { justify-content: center; gap: 10px; padding-inline: 0; }
.stack .k { padding-inline: 20px; }
.row { display: flex; gap: 8px; width: max-content; animation: slide 40s linear infinite; }
.row.rev { animation-direction: reverse; }
.row span { padding: 8px 12px; border-radius: 10px; background: var(--tile-2); border: 1px solid var(--line); font: 500 13px/1 var(--mono); white-space: nowrap; }
@keyframes slide { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .row { animation: none; flex-wrap: wrap; width: auto; padding-inline: 20px; } .row.dup { display: none; } }

/* projects */
.proj { cursor: pointer; text-align: left; gap: 8px; transition: transform .2s; }
.proj:hover { transform: translateY(-2px); }
.proj h3 { font: 700 21px/1.1 var(--display); letter-spacing: -.02em; }
.proj p { color: var(--soft); font-size: 14px; }
.proj .m { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; align-items: baseline; }
.proj .m b { font: 800 30px/1 var(--display); letter-spacing: -.03em; color: var(--accent); }
.proj .m span { color: var(--soft); font-size: 13px; }
.proj .arr { position: absolute; top: 16px; right: 18px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--tile-2); transition: transform .2s, background-color .2s; }
.proj:hover .arr { transform: rotate(45deg); background: var(--accent); color: var(--accent-ink); }

/* misc */
.langs { display: grid; gap: 8px; margin-top: auto; }
.langs div { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px; }
.langs b { font-weight: 600; }
.edu h3 { font: 700 20px/1.15 var(--display); letter-spacing: -.02em; margin-top: 10px; }
.edu p { color: var(--soft); font-size: 14px; }
.edu .y { margin-top: auto; font: 800 34px/1 var(--display); color: var(--accent); }
.contact { background: var(--ink); color: var(--tile); justify-content: space-between; gap: 18px; }
.contact .k { color: color-mix(in srgb, var(--tile) 60%, transparent); }
.contact h3 { font: 800 clamp(28px, 3vw, 40px)/1 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.contact .mail { font: 500 15px/1.3 var(--mono); word-break: break-all; text-align: left; border-bottom: 1px dashed currentColor; align-self: flex-start; }
.contact .cta .btn { background: transparent; border-color: color-mix(in srgb, var(--tile) 25%, transparent); color: var(--tile); }
.skills-t { gap: 14px; }
.skills-t .groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 18px; }
.skills-t h4 { font: 600 13px/1.2 var(--body); margin-bottom: 4px; }
.skills-t p { color: var(--soft); font-size: 13px; line-height: 1.5; }

/* sheet */
dialog { margin: auto; width: min(640px, calc(100% - 32px)); max-height: min(86vh, 900px); border: 1px solid var(--line); border-radius: 24px; background: var(--tile); color: var(--ink); padding: 28px; }
dialog::backdrop { background: rgba(5, 6, 10, .5); backdrop-filter: blur(6px); }
dialog h2 { font: 800 32px/1 var(--display); letter-spacing: -.035em; margin-block: 8px 6px; padding-right: 40px; }
dialog .tag { color: var(--soft); }
dialog .desc { margin-top: 16px; }
dialog .ms { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 18px; }
dialog .ms div { background: var(--tile-2); border-radius: 14px; padding: 12px; }
dialog .ms b { display: block; font: 800 26px/1 var(--display); color: var(--accent); }
dialog .ms span { font-size: 13px; color: var(--soft); }
dialog ul { margin-top: 16px; padding-left: 18px; display: grid; gap: 6px; }
dialog .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
dialog .chips span { padding: 6px 10px; border-radius: 8px; background: var(--tile-2); font: 500 12px/1 var(--mono); }
dialog .x { position: absolute; top: 18px; right: 18px; width: 36px; height: 36px; border-radius: 50%; background: var(--tile-2); }

@media (prefers-reduced-motion: no-preference) {
  .tile { animation: pop .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes pop { from { transform: translateY(10px) scale(.985); } }
}
@media (max-width: 980px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .skills-t .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .s-intro, .s-2 { grid-column: auto; }
  .s-intro, .s-r2 { grid-row: auto; }
  .skills-t .groups { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="page">
  <div class="bar"><span class="mark">ubö.</span><button class="pill" type="button" data-lang-btn>EN</button></div>
  <main class="board" id="board"></main>
</div>
<dialog id="sheet" aria-labelledby="sheetTitle"><button class="x" type="button" aria-label="Close">✕</button><div id="sheetBody"></div></dialog>

<script src="../assets/js/data.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const { D, L, esc, $, $$, t } = S;
  const UI = {
    tr: { open: "Yeni fırsatlara açık", projects: "Projeleri gör", cv: "İletişim", local: "Ankara'da saat", now: "Şu an", since: "Ocak 2023'ten beri", career: "Kariyer, ölçekli", arch: "İmza işi", archT: "Monolitten .NET 8 mikroservislere",
      archP: "Ocelot gateway arkasında bağımsız ölçeklenen servisler, Graylog ile izleme.", stack: "Günlük araç kutusu", langs: "Diller", edu: "Eğitim", contact: "İletişim", contactT: "Bir sonraki büyük sistem için konuşalım.", copy: "E-postayı kopyala", copied: "Kopyalandı ✓",
      skills: "Yetkinlik haritası", highlights: "Öne çıkanlar", native: "Ana dil", pro: "Profesyonel", basic: "Temel", y: "yıl", m: "ay", case: "Vaka" },
    en: { open: "Open to opportunities", projects: "See the work", cv: "Contact", local: "Local time in Ankara", now: "Right now", since: "Since January 2023", career: "Career, to scale", arch: "Signature work", archT: "Monolith to .NET 8 microservices",
      archP: "Independently scaling services behind an Ocelot gateway, observed through Graylog.", stack: "Daily toolbox", langs: "Languages", edu: "Education", contact: "Contact", contactT: "Let's talk about your next big system.", copy: "Copy email", copied: "Copied ✓",
      skills: "Skill map", highlights: "Highlights", native: "Native", pro: "Professional", basic: "Basic", y: "yr", m: "mo", case: "Case" }
  };

  const months = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  const START = new Date(2020, 0, 1), NOW = new Date();
  const segs = [
    { c: "MedDATA", a: new Date(2020, 0, 1), b: new Date(2022, 0, 1) },
    { c: "Fonet", a: new Date(2022, 0, 1), b: new Date(2022, 4, 1) },
    { c: "Limak", a: new Date(2022, 4, 1), b: NOW }
  ];

  function tile(cls, inner, i) { return `<div class="tile ${cls}" style="--i:${i}">${inner}</div>`; }

  function render() {
    const fmt = (n) => n.toLocaleString(S.lang === "tr" ? "tr-TR" : "en-US");
    const st = D.stats;
    const total = months(START, NOW);
    const lead = months(new Date(2023, 0, 1), NOW);
    const leadTxt = `${Math.floor(lead / 12)} ${t("y")} ${lead % 12} ${t("m")}`;
    const jobs = D.experience.slice().reverse();
    const allTech = [...new Set(D.skills.flatMap((g) => g.items))];
    const half = Math.ceil(allTech.length / 2);
    const row = (arr, rev) => `<div class="row ${rev ? "rev" : ""}">${[...arr, ...arr].map((x, i) => `<span${i >= arr.length ? ' class="dup" aria-hidden="true"' : ""}>${esc(x)}</span>`).join("")}</div>`;
    let i = 0;
    const html = [
      tile("s-intro intro", `
        <div><div class="mono-av">UB</div><h1>${esc(D.name)}</h1><p class="hl">${esc(L(D.headline))}</p></div>
        <div style="display:grid;gap:16px"><span class="status"><i></i>${t("open")} · ${esc(L(D.location))}</span>
        <div class="cta"><a class="btn primary" href="#p0">${t("projects")} ↓</a><a class="btn" href="#contact">${t("cv")}</a></div></div>`, i++),
      tile("clock", `<span class="k">${t("local")}</span><div class="t" id="clk">--:--</div><div class="d">UTC+3 · 39.9° N</div>`, i++),
      tile("stat", `<span class="k">${esc(L(st[0].label))}</span><div class="big">${st[0].value}${st[0].suffix}</div><p>2020 → ${NOW.getFullYear()}</p>`, i++),
      tile("now", `<span class="k">${t("now")}</span><h3>${esc(L(D.experience[0].positions[0].title))}</h3><p>${esc(D.experience[0].company)}</p><div class="since"><span class="k">${t("since")}</span><b>${leadTxt}</b></div>`, i++),
      tile("stat", `<span class="k">${esc(L(st[1].label))}</span><div class="team" aria-hidden="true">${"<i></i>".repeat(10)}</div><div class="big" style="margin-top:auto">${st[1].value}</div>`, i++),
      tile("s-2 career", `<span class="k">${t("career")}</span>
        <div class="track">${segs.map((s) => `<div class="seg" style="flex:${months(s.a, s.b)}" title="${s.c}">${s.c}</div>`).join("")}</div>
        <div class="axis"><span>2020</span><span>2022</span><span>${NOW.getFullYear()}</span></div>
        <ul>${D.experience.map((j, k) => `<li><i style="background:${["var(--accent)", "color-mix(in srgb, var(--accent) 70%, var(--tile-2))", "color-mix(in srgb, var(--accent) 45%, var(--tile-2))"][k]}"></i><div><b>${esc(j.company)}</b><em>${esc(L(j.highlights)[0])}</em></div><span>${esc(L(j.positions[j.positions.length - 1].period)).split("–")[0]}</span></li>`).join("")}</ul>`, i++),
      tile("s-2 s-r2 arch", `<span class="k">${t("arch")}</span><h3>${t("archT")}</h3><p>${t("archP")}</p>
        <svg viewBox="0 0 320 180" role="img" aria-label="Gateway to services diagram">
          <rect class="box" x="4" y="74" width="70" height="32" rx="8"/><text x="39" y="94" text-anchor="middle">Client</text>
          <rect class="acc" x="104" y="70" width="84" height="40" rx="10"/><text class="acc-t" x="146" y="94" text-anchor="middle">Ocelot</text>
          <path class="ln" d="M74 90H104"/>
          ${["Auth", "HR", "Career", "Notify"].map((n, k) => `<rect class="box" x="218" y="${8 + k * 42}" width="76" height="30" rx="8"/><text x="256" y="${27 + k * 42}" text-anchor="middle">${n}</text><path class="ln" d="M188 90C204 90 204 ${23 + k * 42} 218 ${23 + k * 42}"/>`).join("")}
        </svg>
        <div class="since" style="display:flex;gap:16px;margin-top:12px"><div><b style="font:800 30px/1 var(--display);color:var(--accent)">+40%</b><p style="margin:0">${S.lang === "tr" ? "ölçeklenebilirlik" : "scalability"}</p></div><div><b style="font:800 30px/1 var(--display);color:var(--accent)">−25%</b><p style="margin:0">${S.lang === "tr" ? "bakım maliyeti" : "maintenance"}</p></div></div>`, i++),
      tile("stat", `<span class="k">${esc(L(st[2].label))}</span><div class="big">${fmt(st[2].value)}${st[2].suffix}</div><p>Career İK · 40+ ${S.lang === "tr" ? "otel" : "hotels"}</p>`, i++),
      tile("stat", `<span class="k">${esc(L(st[3].label))}</span><div class="big">${st[3].value}${st[3].suffix}</div><p>HL7 · LIS</p>`, i++),
      tile("s-2 stack", `<span class="k">${t("stack")}</span>${row(allTech.slice(0, half))}${row(allTech.slice(half), true)}`, i++),
      ...D.projects.map((p, k) => {
        const m = p.metrics[0];
        return `<button type="button" id="p${k}" class="tile proj" data-id="${p.id}" style="--i:${i++}"><span class="k">${p.category === "limak" ? "Limak" : (S.lang === "tr" ? "Sağlık" : "Health")}</span><span class="arr" aria-hidden="true">↗</span>
          <h3>${esc(L(p.name))}</h3><p>${esc(L(p.tagline))}</p>${m ? `<div class="m"><b>${esc(L(m.value))}</b><span>${esc(L(m.label))}</span></div>` : ""}</button>`;
      }),
      tile("s-2 skills-t", `<span class="k">${t("skills")}</span><div class="groups">${D.skills.map((g) => `<div><h4>${esc(L(g.group))}</h4><p>${g.items.slice(0, 6).map(esc).join(" · ")}</p></div>`).join("")}</div>`, i++),
      tile("langs-t", `<span class="k">${t("langs")}</span><div class="langs">${L(D.languages).map((l) => `<div><b>${esc(l)}</b></div>`).join("")}</div>`, i++),
      tile("edu", `<span class="k">${t("edu")}</span><h3>${esc(D.education.school)}</h3><p>${L(D.education.degrees).map(esc).join(" + ")}</p><div class="y">${esc(D.education.year)}</div>`, i++),
      `<div class="tile s-2 contact" id="contact" style="--i:${i++}"><span class="k">${t("contact")}</span><h3>${t("contactT")}</h3>
        <button class="mail" type="button" id="mail">${esc(D.email)}</button>
        <div class="cta"><button class="btn" type="button" id="copy">${t("copy")}</button><a class="btn" href="${esc(D.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a><a class="btn" href="${esc(D.github)}" target="_blank" rel="noopener">GitHub ↗</a></div></div>`
    ];
    $("#board").innerHTML = html.join("");
    $("#copy").addEventListener("click", (e) => S.copyEmail(e.currentTarget, t("copied")));
    $("#mail").addEventListener("click", () => S.copyEmail($("#copy"), t("copied")));
    tick();
  }

  function tick() {
    const el = $("#clk");
    if (!el) return;
    el.textContent = new Intl.DateTimeFormat("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "Europe/Istanbul" }).format(new Date());
  }
  setInterval(tick, 1000);

  document.addEventListener("pointermove", (e) => {
    $$(".tile").forEach((el) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", e.clientX - r.left + "px");
      el.style.setProperty("--my", e.clientY - r.top + "px");
    });
  });

  const sheet = $("#sheet");
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".proj");
    if (b) {
      const p = D.projects.find((x) => x.id === b.dataset.id);
      $("#sheetBody").innerHTML = `<span class="k">${t("case")} · ${p.category === "limak" ? "Limak Technology" : (S.lang === "tr" ? "Sağlık Bilişimi" : "Healthcare IT")}</span>
        <h2 id="sheetTitle">${esc(L(p.name))}</h2><p class="tag">${esc(L(p.tagline))}</p>
        ${p.metrics.length ? `<div class="ms">${p.metrics.map((m) => `<div><b>${esc(L(m.value))}</b><span>${esc(L(m.label))}</span></div>`).join("")}</div>` : ""}
        <p class="desc">${esc(L(p.description))}</p>
        <ul>${L(p.highlights).map((h) => `<li>${esc(h)}</li>`).join("")}</ul>
        <div class="chips">${p.tech.map((x) => `<span>${esc(x)}</span>`).join("")}</div>`;
      sheet.showModal();
    }
    if (e.target.closest(".x") || e.target === sheet) sheet.close();
  });

  S.start(UI, render);
})();
</script>
</body>
</html>
