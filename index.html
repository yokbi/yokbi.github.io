<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uğur Buğra Özkaya — Software Team Lead</title>
  <meta name="description" content="Uğur Buğra Özkaya — Software Development Team Lead. .NET microservices, Next.js, CI/CD, healthcare integrations.">
  <meta property="og:title" content="Uğur Buğra Özkaya — Software Team Lead">
  <meta property="og:description" content=".NET microservices, Next.js, CI/CD and healthcare integrations. 6+ years of experience.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yokbi.github.io/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236d5dfc'/><text x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='700' font-size='26' fill='white'>UB</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="progress" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="#top" class="brand" aria-label="Home"><span class="brand-mark">UB</span><span class="brand-name">Özkaya</span></a>
    <nav class="nav-links" id="navLinks">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#experience" data-i18n="nav.experience"></a>
      <a href="#projects" data-i18n="nav.projects"></a>
      <a href="#skills" data-i18n="nav.skills"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="langBtn" type="button" aria-label="Language">EN</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow mono"><span class="dot"></span><span data-i18n="hero.status"></span></p>
      <h1 class="hero-name" id="heroName"></h1>
      <p class="hero-role mono"><span class="prompt">&gt;</span> <span id="typed"></span><span class="caret">_</span></p>
      <p class="hero-sub" data-i18n="hero.sub"></p>
      <div class="hero-cta">
        <a href="#projects" class="btn btn-primary" data-i18n="hero.cta1"></a>
        <a href="#contact" class="btn btn-ghost" data-i18n="hero.cta2"></a>
      </div>
      <div class="stats" id="stats"></div>
      <a href="#about" class="scroll-hint" aria-label="Scroll"><span></span></a>
    </section>

    <section id="about" class="section">
      <h2 class="section-title reveal"><span class="mono num">01</span><span data-i18n="nav.about"></span></h2>
      <div class="about-grid">
        <p class="about-text reveal" id="summary"></p>
        <aside class="about-card reveal">
          <div class="about-row"><span class="mono muted" data-i18n="about.location"></span><span id="location"></span></div>
          <div class="about-row"><span class="mono muted" data-i18n="about.education"></span><span id="eduShort"></span></div>
          <div class="about-row"><span class="mono muted" data-i18n="about.languages"></span><span id="langs"></span></div>
          <div class="about-row"><span class="mono muted" data-i18n="about.focus"></span><span data-i18n="about.focusVal"></span></div>
        </aside>
      </div>
    </section>

    <section id="experience" class="section">
      <h2 class="section-title reveal"><span class="mono num">02</span><span data-i18n="nav.experience"></span></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="projects" class="section">
      <h2 class="section-title reveal"><span class="mono num">03</span><span data-i18n="nav.projects"></span></h2>
      <div class="filters reveal" id="filters" role="tablist"></div>
      <div class="projects" id="projectGrid"></div>
    </section>

    <section id="skills" class="section">
      <h2 class="section-title reveal"><span class="mono num">04</span><span data-i18n="nav.skills"></span></h2>
      <div class="skills" id="skillGrid"></div>
      <div class="edu reveal" id="edu"></div>
    </section>

    <section id="contact" class="section contact">
      <h2 class="section-title reveal"><span class="mono num">05</span><span data-i18n="nav.contact"></span></h2>
      <div class="contact-card reveal">
        <h3 data-i18n="contact.title"></h3>
        <p class="muted" data-i18n="contact.text"></p>
        <div class="contact-actions">
          <button class="btn btn-primary" id="copyEmail" type="button">
            <span id="emailText"></span>
            <span class="copy-label mono" data-i18n="contact.copy"></span>
          </button>
          <a class="btn btn-ghost" id="linkedinLink" target="_blank" rel="noopener">LinkedIn ↗</a>
          <a class="btn btn-ghost" id="githubLink" target="_blank" rel="noopener">GitHub ↗</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer mono">
    <span>© <span id="year"></span> <span id="footName"></span></span>
    <span class="muted" data-i18n="footer.made"></span>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-close" type="button" data-close aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </article>
  </div>

  <div class="toast mono" id="toast" role="status"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
