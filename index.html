<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yokbi Games</title>
  <meta name="description" content="Yokbi Games: bağımsız mobil, PC ve web oyunları. No.9 futbolcu kariyeri ve yapım aşamasındaki diğer oyunlar.">
  <meta property="og:title" content="Yokbi Games">
  <meta property="og:description" content="Independent mobile, PC and web games. No.9: Striker Career, and what's next.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yokbi.github.io/">
  <meta property="og:image" content="https://yokbi.github.io/img/games/no9.webp">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230b0d10'/><path d='M14 18h10l8 14 8-14h10L37 38v10H27V38z' fill='%23d6ff3d'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" aria-label="Yokbi Games">
      <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--accent)"/><path d="M14 18h10l8 14 8-14h10L37 38v10H27V38z" fill="var(--bg)"/></svg>
      <span>YOKBI <em>GAMES</em></span>
    </a>
    <nav class="nav-links">
      <a href="#games" data-t="navGames"></a>
      <a href="#studio" data-t="navStudio"></a>
      <a href="#contact" data-t="navContact"></a>
    </nav>
    <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
  </header>

  <main id="top">
    <!-- Featured: No.9 -->
    <section class="hero">
      <div class="hero-copy">
        <p class="kicker"><span class="pulse"></span><span data-t="heroKicker"></span></p>
        <h1 class="hero-title">No.9<span data-t="heroSubtitle"></span></h1>
        <p class="hero-lead" data-t="heroLead"></p>
        <ul class="hero-points">
          <li data-t="heroP1"></li>
          <li data-t="heroP2"></li>
          <li data-t="heroP3"></li>
        </ul>
        <div class="cta">
          <span class="btn btn-store" aria-disabled="true">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5.4l3.6 2.1-.8 1.4L11 13.1V7z"/></svg>
            <span><small data-t="storeSoonSmall"></small><b>App Store</b></span>
          </span>
          <a class="btn btn-ghost" href="no9/" data-t="heroMore"></a>
        </div>
      </div>
      <div class="hero-shots" id="shots" aria-label="No.9 screenshots"></div>
    </section>

    <section class="strip" aria-label="Studio in numbers">
      <div><b id="countGames">14</b><span data-t="statGames"></span></div>
      <div><b>4</b><span data-t="statPlatforms"></span></div>
      <div><b>TR · EN</b><span data-t="statLangs"></span></div>
    </section>

    <section id="games" class="section">
      <div class="section-head">
        <h2 data-t="gamesTitle"></h2>
        <p class="muted" data-t="gamesLead"></p>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section id="studio" class="section studio">
      <div class="section-head">
        <h2 data-t="studioTitle"></h2>
      </div>
      <div class="studio-grid">
        <article><h3 data-t="v1t"></h3><p data-t="v1"></p></article>
        <article><h3 data-t="v2t"></h3><p data-t="v2"></p></article>
        <article><h3 data-t="v3t"></h3><p data-t="v3"></p></article>
      </div>
    </section>

    <section id="contact" class="section contact">
      <h2 data-t="contactTitle"></h2>
      <p class="muted" data-t="contactLead"></p>
      <a class="btn btn-primary" href="mailto:yokbiyahk@gmail.com">yokbiyahk@gmail.com</a>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="year">2026</span> Yokbi Games</span>
    <span class="footer-links">
      <a href="no9/" data-t="footSupport"></a>
      <a href="no9/privacy/" id="privacyLink" data-t="footPrivacy"></a>
    </span>
  </footer>

  <script src="assets/js/games.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
